# Browser checks for the public site that need real layout (ADR-0069 D10,
# "The guard"): the identity lines' 32px safe distance through every frame of
# the President's Message entrance, reduced motion, the largest paint, and the
# message text against the record, character for character.
#
# Separate from CI on purpose: it downloads a browser and starts a dev server,
# so it runs only when the public site or the tokens change, or on demand.
# The API is a fixture server serving the published record (e2e/fixture-api.mjs);
# no database, no secret.
name: Web browser checks

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/design-tokens/**
      - .github/workflows/web-browser-checks.yml
  workflow_dispatch:

concurrency:
  group: web-browser-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: web · browser checks (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      UAEAF_API_URL: http://localhost:3000
      WEB_BASE_URL: http://localhost:3001
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        working-directory: .
        run: npm ci
      # packages/design-tokens/build/ is not committed; the site imports it.
      - name: Build design tokens
        working-directory: .
        run: npm run build -w @uaeaf/design-tokens
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Start the fixture API
        run: node e2e/fixture-api.mjs > fixture-api.log 2>&1 &
      - name: Start the site
        run: npx next dev --port 3001 > next-dev.log 2>&1 &
      # The first request compiles the route; the checks start once both
      # locales of the page answer.
      - name: Wait for the page
        run: |
          for path in ar/about/governance/vision-mission en/about/governance/vision-mission; do
            curl --silent --fail --retry 60 --retry-delay 5 --retry-all-errors --max-time 300 \
              --output /dev/null "$WEB_BASE_URL/$path"
          done
          for locale in ar en; do
            curl --silent --fail --retry 60 --retry-delay 5 --retry-all-errors --max-time 300 \
              --output /dev/null "$WEB_BASE_URL/$locale/about/president"
          done
      - name: Browser checks
        run: npx playwright test
      - name: Server logs
        if: ${{ failure() }}
        run: tail -n 200 next-dev.log fixture-api.log
