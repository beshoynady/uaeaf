<style>
body{margin:0;background:#FAFAF8}
*{box-sizing:border-box}
a{color:#006B31}a:hover{color:#00502A}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #0B0B0B;outline-offset:3px}
.on-dark a:focus-visible,.on-dark button:focus-visible{outline-color:#FFFFFF}
.ni{position:relative;height:88px;display:inline-flex;align-items:center;gap:5px;padding:0 2px;font-size:15px;font-weight:500;color:#1F2328;text-decoration:none}
.ni:hover{color:#006B31}
.ni-on{color:#006B31;font-weight:700}
.ni-on::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;border-radius:3px 3px 0 0;background:linear-gradient(to left,#00843D 0 33%,#0B0B0B 33% 66%,#C8102E 66%)}
.util{display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:#F3F4F1;border:1px solid #E6E8E4}
.ub{width:40px;height:40px;border-radius:50%;border:none;background:transparent;color:#1F2328;display:inline-flex;align-items:center;justify-content:center;font-family:inherit;font-size:13px;font-weight:800;text-decoration:none;cursor:pointer}
.ub:hover{background:#FFFFFF}
.u-sep{width:1px;height:20px;background:#DADDD8;margin:0 2px}
.anc{height:42px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.3);color:#FFFFFF;font-size:14px;font-weight:600;display:inline-flex;align-items:center;text-decoration:none;transition:background .2s}
.anc:hover{background:rgba(255,255,255,.12);color:#FFFFFF}
.sh{display:flex;flex-direction:column;gap:10px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:#00843D}
.eyebrow::before{content:"";width:28px;height:3px;border-radius:2px;background:linear-gradient(to left,#00843D 0 33%,#0B0B0B 33% 66%,#C8102E 66%)}
.dc{position:relative;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;border:1px solid #E3E5E2;background:#FFFFFF;font-family:inherit;text-align:start;cursor:pointer;transition:all .25s}
.dc:hover{border-color:#0B0B0B}
.dc-on,.dc-on:hover{background:#0B0B0B;border-color:#0B0B0B;color:#FFFFFF}
.dc-on .dci{background:#00843D;color:#FFFFFF}
.dci{flex-shrink:0;width:44px;height:44px;border-radius:12px;background:#E4F3EA;color:#006B31;display:flex;align-items:center;justify-content:center;transition:all .25s}
.evc{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:12px;border:1px solid #E3E5E2;background:#FFFFFF;font-family:inherit;font-size:14px;font-weight:600;color:#0B0B0B;cursor:pointer;transition:all .2s}
.evc:hover{border-color:#00843D}
.evc-on,.evc-on:hover{background:#E4F3EA;border-color:#00843D;color:#00602C}
.inp{height:52px;padding:0 16px;border-radius:14px;border:1px solid #D5D8D4;background:#FFFFFF;font-family:inherit;font-size:16px;color:#0B0B0B}
.btn-p{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 24px;border-radius:14px;border:none;background:#00843D;color:#FFFFFF;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none}
.btn-p:hover{background:#006B31;color:#FFFFFF}
.cb{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 12px;border-radius:10px;border:1px solid #D5D8D4;background:#FFFFFF;font-size:13px;font-weight:600;color:#0B0B0B;text-decoration:none}
.cb:hover{border-color:#0B0B0B;color:#0B0B0B}
.club{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:18px;background:#FFFFFF;border:1px solid #E3E5E2;transition:box-shadow .3s,border-color .3s}
.club:hover{box-shadow:0 14px 30px rgba(11,11,11,.08);border-color:#CFE8D8}
details.faq{border-radius:16px;background:#FFFFFF;border:1px solid #E3E5E2;overflow:hidden}
details.faq summary{list-style:none;cursor:pointer;padding:20px 22px;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:12px}
details.faq summary::-webkit-details-marker{display:none}
details.faq[open] summary{color:#006B31}
details.faq[open] .pl{transform:rotate(45deg)}
.pl{transition:transform .25s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){.rise{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}}

.tf{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid #E3E5E2;background:#FFFFFF;font-family:inherit;font-size:13px;font-weight:600;color:#1F2328;cursor:pointer;white-space:nowrap}
.tf:hover{border-color:#0B0B0B}
.tf-on,.tf-on:hover{background:#0B0B0B;border-color:#0B0B0B;color:#FFFFFF}
.tf .n{font-size:11px;font-weight:700;opacity:.7}
.gh{display:flex;align-items:center;gap:8px;padding:14px 20px 6px;font-size:12px;font-weight:700;color:#5B6167}
.gh .c{margin-inline-start:auto;font-weight:500}
.ri{display:flex;align-items:center;gap:14px;margin:0 10px;padding:10px 10px;border-radius:12px;text-decoration:none;color:#0B0B0B}
.ri:hover{background:#F2F7F3;color:#0B0B0B}
.ri-on{background:#F2F7F3;box-shadow:inset -3px 0 0 #00843D}
.th{flex-shrink:0;width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#FFFFFF}
.rt{font-size:15px;font-weight:600;line-height:1.5}
.rt mark{background:#FFF1D6;color:#0B0B0B;border-radius:3px;padding:0 1px}
.rm{font-size:12px;color:#5B6167}
.more{display:flex;align-items:center;gap:6px;margin:4px 20px 6px;height:34px;padding:0 10px;border:none;background:none;border-radius:8px;font-family:inherit;font-size:13px;font-weight:700;color:#006B31;cursor:pointer}
.more:hover{background:#F2F7F3}
.sug{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:#F3F4F1;font-family:inherit;font-size:13px;font-weight:600;color:#1F2328;border:none;cursor:pointer}
.sug:hover{background:#E4F3EA;color:#00602C}
